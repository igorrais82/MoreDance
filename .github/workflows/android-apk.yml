name: Android APK

# Сборка APK в облаке: на Windows-машине сборка упирается в лимит длины путей
# (CMake/ninja и react-native-gesture-handler), на Linux-раннере этой проблемы нет.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/MoreDance.apk
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: MoreDance-apk
          path: artifacts/MoreDance.apk
          retention-days: 30
